<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>I Hate Ads</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="I Hate Ads">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#17181A">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%2317181A'/%3E%3Crect x='68' y='55' width='44' height='95' rx='10' fill='none' stroke='%23ECECEE' stroke-width='6'/%3E%3Crect x='74' y='95' width='32' height='50' rx='4' fill='%234C8DFF'/%3E%3C/svg%3E">
<style>
:root{
  --bg: #17181A;
  --panel: #222327;
  --border: #34353A;
  --ink: #ECECEE;
  --ink-dim: #8E8F94;
  --accent: #4C8DFF;
  --accent-ink: #FFFFFF;
  --good: #3FBE72;
}

*{ box-sizing: border-box; }

html, body{
  margin:0; padding:0; min-height:100%;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.wrap{
  max-width: 640px; margin: 0 auto;
  padding: 28px 16px 40px;
  display:flex; flex-direction:column; align-items:center;
  min-height:100vh;
}

.title{
  font-size: clamp(22px, 6vw, 28px);
  font-weight: 700;
  color: var(--ink);
  margin: 4px 0 2px;
  text-align:center;
}
.subtitle{
  color: var(--ink-dim);
  font-size: 13px;
  margin-bottom: 20px;
  text-align:center;
}

.hud{
  width:100%;
  display:flex; align-items:center; justify-content:space-between;
  gap:10px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
  margin-bottom: 20px;
}
.hud-stat{ text-align:center; flex:1; }
.hud-stat .num{ font-weight:700; font-size:18px; color: var(--ink); display:block; line-height:1.1;}
.hud-stat .lbl{ font-size:11px; color: var(--ink-dim); }
.hud-div{ width:1px; height:26px; background: var(--border); }

.controls{
  display:flex; gap:8px; margin-bottom: 12px;
  flex-wrap: wrap; justify-content:center;
}
.banner{
  display:none;
  width:100%;
  background: rgba(230,159,58,0.12);
  border: 1px solid rgba(230,159,58,0.4);
  color: #E6A64E;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  text-align:center;
  margin-bottom: 14px;
}
.banner.show{ display:block; }
.btn{
  font-family: inherit;
  font-weight: 600; font-size:13px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 14px;
  cursor:pointer;
  transition: background .12s ease, transform .1s ease;
}
.btn:hover{ background: #2A2B30; }
.btn:active{ transform: scale(0.97); }
.btn.gold{
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
.btn.gold:hover{ background: #3D77E0; }
.btn:disabled{ opacity:.4; cursor:default; }

.board{
  display:flex; flex-wrap:wrap; justify-content:center;
  gap: 16px 12px;
  width:100%;
  padding: 12px 0;
}

.bottle-slot{
  display:flex; flex-direction:column; align-items:center;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color: transparent;
}

.bottle{
  position:relative;
  width: 50px;
  height: 164px;
  border-radius: 8px 8px 18px 18px;
  border: 2px solid var(--border);
  background: var(--panel);
  display:flex; flex-direction:column-reverse;
  overflow:hidden;
  transition: transform .15s ease, box-shadow .15s ease;
}

.bottle-slot.selected .bottle{
  transform: translateY(-10px);
  box-shadow: 0 0 0 2px var(--accent);
}
.bottle-slot.shake .bottle{
  animation: shake .3s ease;
}
@keyframes shake{
  0%,100%{ transform: translateX(0); }
  25%{ transform: translateX(-5px); }
  75%{ transform: translateX(5px); }
}

.segment{
  width:100%;
  flex: 0 0 auto;
}

.bottle-slot.solved .bottle{
  box-shadow: 0 0 0 2px var(--good);
}

.bottle-slot.locked-slot .bottle{ opacity:.55; }
.lock-icon{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-size:20px;
  background: rgba(0,0,0,0.35);
  pointer-events:none;
}
.segment.key-seg{
  background: #F1C40F;
  display:flex; align-items:center; justify-content:center;
  font-size:12px;
}
.bottle-slot .tag{
  font-size: 10px;
  color: var(--ink-dim);
  margin-top: 4px;
  text-align:center;
}
.key-icon{
  font-size:18px;
  pointer-events:none;
}
.bottle.giant{
  border-color: var(--accent);
  border-width: 3px;
}
.segment.mystery{
  background: #3A3B40;
  color: var(--ink-dim);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700;
  pointer-events:none;
}

.overlay{
  position: fixed; inset:0; z-index: 50;
  background: rgba(0,0,0,0.6);
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
  transition: opacity .2s ease;
}
.overlay.show{ opacity:1; pointer-events:auto; }
.overlay-card{
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 26px;
  text-align:center;
  max-width: 300px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.18);
  transform: scale(0.92);
  transition: transform .2s ease;
}
.overlay.show .overlay-card{ transform: scale(1); }
.overlay-card h2{
  color: var(--ink);
  margin: 0 0 6px;
  font-size: 20px;
  font-weight: 700;
}
.overlay-card p{ color: var(--ink-dim); margin: 4px 0 20px; font-size:13px; }

@media (max-width: 380px){
  .bottle{ width: 42px; height: 144px; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="title">I Hate Ads</div>

  <div class="hud">
    <div class="hud-stat">
      <span class="num" id="levelNum">1</span>
      <span class="lbl">Level</span>
    </div>
    <div class="hud-div"></div>
    <div class="hud-stat">
      <span class="num" id="movesNum">0</span>
      <span class="lbl">Moves</span>
    </div>
    <div class="hud-div"></div>
    <div class="hud-stat">
      <span class="num" id="colorsNum">3</span>
      <span class="lbl">Colors</span>
    </div>
  </div>

  <div class="banner" id="stuckBanner">This position can't be solved from here. Undo or add a bottle to keep going.</div>

  <div class="controls">
    <button class="btn" id="undoBtn">↺ Undo</button>
    <button class="btn" id="addBottleBtn">+ Add Bottle</button>
    <button class="btn" id="resetBtn">⟲ Restart</button>
  </div>
  <div class="controls">
    <button class="btn" id="exportBtn">⇩ Save to Files</button>
    <button class="btn" id="importBtn">⇧ Load Save</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>

  <div class="board" id="board"></div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h2 id="overlayTitle">Level Complete!</h2>
    <p id="overlayText">Solved in 0 moves.</p>
    <button class="btn gold" id="nextBtn">Next Level →</button>
  </div>
</div>

<script>
(function(){
  const CAP = 4;
  const PALETTE = ['#E74C3C','#E67E22','#F1C40F','#27AE60','#16A085','#2E86DE','#8E44AD','#E84393','#7F8C8D','#2C3E50'];
  const NAMES = ['Red','Orange','Gold','Green','Teal','Blue','Purple','Pink','Slate','Navy'];
  const SAVE_KEY = 'ihateads_save_v2';

  let level = 1;
  let bottles = [];
  let caps = [];
  let locked = [];
  let needColor = [];
  let colors = 3;
  let selected = -1;
  let moves = 0;
  let history = [];
  let won = false;
  let solveCache = new Map();

  const board = document.getElementById('board');
  const overlay = document.getElementById('overlay');
  const levelNum = document.getElementById('levelNum');
  const movesNum = document.getElementById('movesNum');
  const colorsNum = document.getElementById('colorsNum');
  const undoBtn = document.getElementById('undoBtn');
  const addBottleBtn = document.getElementById('addBottleBtn');
  const resetBtn = document.getElementById('resetBtn');
  const nextBtn = document.getElementById('nextBtn');
  const stuckBanner = document.getElementById('stuckBanner');
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const importFile = document.getElementById('importFile');

  function unit(c){ return { c: c, m: false, r: false, k: false }; }
  function keyUnit(){ return { c: -1, m: false, r: true, k: true }; }

  function shuffle(a){
    for(let i=a.length-1;i>0;i--){
      const j = (Math.random()*(i+1))|0;
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function cloneB(b){
    const out = new Array(b.length);
    for(let i=0;i<b.length;i++){
      const src = b[i], dst = new Array(src.length);
      for(let j=0;j<src.length;j++){
        const u = src[j];
        dst[j] = { c: u.c, m: u.m, r: u.r, k: u.k };
      }
      out[i] = dst;
    }
    return out;
  }

  function sig(b, lk){
    let s = '';
    for(let i=0;i<b.length;i++){
      const bt = b[i];
      for(let j=0;j<bt.length;j++) s += (bt[j].k ? 'K' : bt[j].c) + '.';
      s += lk[i] ? '#' : '|';
    }
    return s;
  }

  function solved(b, lk){
    const seen = {};
    for(let i=0;i<b.length;i++){
      if(lk[i]) return false;
      const bt = b[i];
      if(bt.length === 0) continue;
      const c = bt[0].c;
      if(bt[0].k) return false;
      for(let j=1;j<bt.length;j++) if(bt[j].c !== c) return false;
      if(seen[c]) return false;
      seen[c] = 1;
    }
    return true;
  }

  function colorDone(b, c){
    let found = -1;
    for(let i=0;i<b.length;i++){
      const bt = b[i];
      let has = false, pure = true;
      for(let j=0;j<bt.length;j++){
        if(bt[j].c === c) has = true; else pure = false;
      }
      if(has){
        if(!pure || found !== -1) return false;
        found = i;
      }
    }
    return found !== -1;
  }

  function settle(b, lk, need){
    let nb = b, nl = lk, changed = false;
    for(let i=0;i<nb.length;i++){
      const bt = nb[i];
      if(bt.length && bt[bt.length-1].k){
        if(!changed){ nb = cloneB(b); nl = lk.slice(); changed = true; }
        nb[i] = nb[i].slice(0, -1);
        for(let q=0;q<nl.length;q++) if(nl[q] && need[q] === null) nl[q] = false;
      }
    }
    for(let i=0;i<nl.length;i++){
      if(nl[i] && need[i] !== null && colorDone(nb, need[i])){
        if(!changed){ nb = cloneB(b); nl = lk.slice(); changed = true; }
        nl[i] = false;
      }
    }
    return changed ? { b: nb, lk: nl } : { b: b, lk: lk };
  }

  function moveList(b, cp, lk){
    const mv = [];
    for(let i=0;i<b.length;i++){
      if(lk[i] || b[i].length === 0) continue;
      const top = b[i][b[i].length-1];
      if(top.k) continue;
      let run = 1;
      for(let q=b[i].length-2;q>=0 && !b[i][q].k && b[i][q].c===top.c;q--) run++;
      if(run === b[i].length && b[i].length > 0){
        let onlyColor = true;
        for(let q=0;q<b[i].length;q++) if(b[i][q].c !== top.c) onlyColor = false;
        if(onlyColor && b[i].length === cp[i]) continue;
      }
      for(let j=0;j<b.length;j++){
        if(i === j || lk[j] || b[j].length >= cp[j]) continue;
        if(b[j].length){
          const d = b[j][b[j].length-1];
          if(d.k || d.c !== top.c) continue;
        } else if(run === b[i].length) continue;
        mv.push([i,j]);
      }
    }
    return mv;
  }

  function pour(b, i, j, cp){
    const nb = cloneB(b);
    const f = nb[i], t = nb[j];
    const c = f[f.length-1].c;
    while(f.length && !f[f.length-1].k && f[f.length-1].c === c && t.length < cp[j]) t.push(f.pop());
    return nb;
  }

  function solvable(b, lk, cp, need, budget){
    let st = settle(b, lk, need);
    if(solved(st.b, st.lk)) return true;
    const seen = new Set([sig(st.b, st.lk)]);
    let frontier = [st];
    let n = 0;
    while(frontier.length){
      const next = [];
      for(let f=0;f<frontier.length;f++){
        const cur = frontier[f];
        const mv = moveList(cur.b, cp, cur.lk);
        for(let m=0;m<mv.length;m++){
          const nb = pour(cur.b, mv[m][0], mv[m][1], cp);
          const s2 = settle(nb, cur.lk, need);
          const k = sig(s2.b, s2.lk);
          if(seen.has(k)) continue;
          if(solved(s2.b, s2.lk)) return true;
          seen.add(k);
          next.push(s2);
          if(++n > budget) return null;
        }
      }
      frontier = next;
    }
    return false;
  }

  function specialFor(lvl){
    if(lvl < 3 || lvl % 3 !== 0) return null;
    return ['giant','lockkey','mystery','colorlock'][((lvl/3 - 1) % 4)|0];
  }

  function params(lvl){
    let c = Math.min(3 + (((lvl-1)/2)|0), 10);
    let e = lvl <= 10 ? 2 : 1;
    if(e === 1) c = Math.min(c, 8);
    return { n: c, e: e };
  }

  function runLen(bt){
    const c = bt[bt.length-1].c;
    let r = 1;
    for(let q=bt.length-2; q>=0 && bt[q].c===c; q--) r++;
    return r;
  }

  function scramble(b, cp, steps, pureIdx, pureColor){
    for(let s=0; s<steps; s++){
      const cand = [];
      for(let j=0;j<b.length;j++){
        if(!b[j].length) continue;
        const c = b[j][b[j].length-1].c;
        const r = runLen(b[j]);
        for(let t=1;t<=r;t++){
          if(!(t < r || b[j].length === t)) continue;
          for(let i=0;i<b.length;i++){
            if(i === j) continue;
            if(b[i].length + t > cp[i]) continue;
            if(b[i].length && b[i][b[i].length-1].c === c) continue;
            if(i === pureIdx && c !== pureColor) continue;
            cand.push([j,i,t]);
          }
        }
      }
      if(!cand.length) break;
      const m = cand[(Math.random()*cand.length)|0];
      const from = b[m[0]], to = b[m[1]];
      for(let t=0;t<m[2];t++) to.push(from.pop());
    }
    return b;
  }

  function freshBoard(n, e, giantColor, extra){
    const b = [], cp = [];
    let pureIdx = -1;
    if(giantColor >= 0){
      const g = [];
      for(let k=0;k<CAP*2;k++) g.push(unit(giantColor));
      pureIdx = 0;
      b.push(g); cp.push(CAP*2);
    }
    for(let c=0;c<n;c++){
      if(c === giantColor) continue;
      const bt = [];
      for(let k=0;k<CAP;k++) bt.push(unit(c));
      b.push(bt); cp.push(CAP);
    }
    for(let i=0;i<e+extra;i++){ b.push([]); cp.push(CAP); }
    scramble(b, cp, 60 + n*25, pureIdx, giantColor);
    return { b: b, cp: cp, pureIdx: pureIdx };
  }

  function permute(g){
    const order = shuffle(g.b.map((_,i)=>i));
    const map = {};
    for(let i=0;i<order.length;i++) map[order[i]] = i;
    return {
      b: order.map(i=>g.b[i]),
      cp: order.map(i=>g.cp[i]),
      lk: order.map(i=>g.lk[i]),
      need: order.map(i=>g.need[i]),
      pureIdx: g.pureIdx >= 0 ? map[g.pureIdx] : -1
    };
  }

  function build(lvl){
    const p = params(lvl);
    const n = p.n;
    const special = specialFor(lvl);
    let label = null;

    if(special === 'giant'){
      const g = (Math.random()*n)|0;
      let f = null;
      for(let a=0;a<25 && !f;a++){
        const t = freshBoard(n, p.e, g, 0);
        if(t.b[t.pureIdx].length >= CAP) f = t;
      }
      if(!f) f = freshBoard(n, p.e, g, 1);
      f.lk = f.b.map(()=>false);
      f.need = f.b.map(()=>null);
      colors = n;
      const r = permute(f);
      return { b: r.b, cp: r.cp, lk: r.lk, need: r.need,
        label: 'Giant vial! It holds double — fill it with ' + NAMES[g] + '.' };
    }

    if(special === 'lockkey' || special === 'colorlock'){
      for(let a=0; a<30; a++){
        const f = freshBoard(n, p.e, -1, 1);
        const lk = f.b.map(()=>false);
        const need = f.b.map(()=>null);

        const filled = [];
        for(let i=0;i<f.b.length;i++) if(f.b[i].length > 0) filled.push(i);
        if(!filled.length) continue;
        const L = filled[(Math.random()*filled.length)|0];

        if(special === 'lockkey'){
          const hosts = [];
          for(let i=0;i<f.b.length;i++) if(i !== L && f.b[i].length < f.cp[i]) hosts.push(i);
          if(!hosts.length) continue;
          const H = hosts[(Math.random()*hosts.length)|0];
          const pos = (Math.random()*(f.b[H].length+1))|0;
          f.b[H].splice(pos, 0, keyUnit());
          lk[L] = true;
          label = 'A key is buried in a vial — dig it out to open the locked one.';
        } else {
          const inL = {};
          for(let j=0;j<f.b[L].length;j++) inL[f.b[L][j].c] = 1;
          const opts = [];
          for(let c=0;c<n;c++) if(!inL[c]) opts.push(c);
          if(!opts.length) continue;
          const target = opts[(Math.random()*opts.length)|0];
          lk[L] = true;
          need[L] = target;
          label = 'Locked vial — finish ' + NAMES[target] + ' to open it.';
        }

        f.lk = lk; f.need = need;
        if(solvable(f.b, f.lk, f.cp, f.need, 40000) === true){
          colors = n;
          const r = permute(f);
          return { b: r.b, cp: r.cp, lk: r.lk, need: r.need, label: label };
        }
      }
    }

    const f = freshBoard(n, p.e, -1, 0);
    f.lk = f.b.map(()=>false);
    f.need = f.b.map(()=>null);
    if(special === 'mystery'){
      const mc = (Math.random()*n)|0;
      for(let i=0;i<f.b.length;i++) for(let j=0;j<f.b[i].length;j++) if(f.b[i][j].c === mc) f.b[i][j].m = true;
      label = 'Mystery color — each drop stays hidden until it surfaces.';
    }
    colors = n;
    const r = permute(f);
    return { b: r.b, cp: r.cp, lk: r.lk, need: r.need, label: label };
  }

  function save(){
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify({ level, bottles, caps, locked, needColor, colors, moves, history }));
    }catch(e){}
  }

  function normalize(d){
    if(!d || !Array.isArray(d.bottles)) return null;
    const len = d.bottles.length;
    d.bottles = d.bottles.map(bt => bt.map(u =>
      (typeof u === 'number') ? unit(u) : { c: u.c, m: !!u.m, r: !!u.r, k: !!u.k }
    ));
    if(!Array.isArray(d.caps) || d.caps.length !== len) d.caps = d.bottles.map(()=>CAP);
    if(!Array.isArray(d.locked) || d.locked.length !== len) d.locked = d.bottles.map(()=>false);
    if(!Array.isArray(d.needColor) || d.needColor.length !== len) d.needColor = d.bottles.map(()=>null);
    if(!Array.isArray(d.history)) d.history = [];
    d.history = d.history.filter(h => h && Array.isArray(h.bottles));
    if(typeof d.level !== 'number') d.level = 1;
    if(typeof d.moves !== 'number') d.moves = 0;
    if(typeof d.colors !== 'number') d.colors = 3;
    return d;
  }

  function load(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      return raw ? normalize(JSON.parse(raw)) : null;
    }catch(e){ return null; }
  }

  function start(lvl, state){
    level = lvl;
    solveCache = new Map();
    if(state){
      bottles = state.bottles;
      caps = state.caps;
      locked = state.locked;
      needColor = state.needColor;
      colors = state.colors;
      moves = state.moves;
      history = state.history;
    } else {
      const g = build(lvl);
      bottles = g.b; caps = g.cp; locked = g.lk; needColor = g.need;
      moves = 0; history = [];
      if(g.label) setTimeout(()=>toast(g.label), 400);
    }
    selected = -1;
    won = false;
    levelNum.textContent = level;
    movesNum.textContent = moves;
    colorsNum.textContent = colors;
    overlay.classList.remove('show');
    draw();
    save();
  }

  function snapshot(){
    history.push({ bottles: cloneB(bottles), caps: caps.slice(), locked: locked.slice(), needColor: needColor.slice() });
    if(history.length > 200) history.shift();
  }

  function applySettle(){
    let opened = false;
    for(let i=0;i<locked.length;i++){
      if(locked[i] && needColor[i] !== null && colorDone(bottles, needColor[i])){
        locked[i] = false; opened = true;
      }
    }
    if(opened) toast('Color finished — vial unlocked!');
    return opened;
  }

  let stuckToken = 0;

  function checkStuck(){
    const tok = ++stuckToken;
    if(won || solved(bottles, locked)){ stuckBanner.classList.remove('show'); return; }
    for(let i=0;i<bottles.length;i++){
      if(bottles[i].length && bottles[i][bottles[i].length-1].k){ stuckBanner.classList.remove('show'); return; }
    }
    if(moveList(bottles, caps, locked).length === 0){ stuckBanner.classList.add('show'); return; }
    const key = sig(bottles, locked) + '/' + caps.join(',');
    const hit = solveCache.get(key);
    if(hit !== undefined){ stuckBanner.classList.toggle('show', hit === false); return; }
    stuckBanner.classList.remove('show');
    setTimeout(function(){
      if(tok !== stuckToken) return;
      const r = solvable(bottles, locked, caps, needColor, 6000);
      if(solveCache.size > 300) solveCache.clear();
      solveCache.set(key, r);
      if(tok === stuckToken) stuckBanner.classList.toggle('show', r === false);
    }, 24);
  }

  function draw(){
    applySettle();
    const frag = document.createDocumentFragment();
    for(let idx=0; idx<bottles.length; idx++){
      const bt = bottles[idx];
      const cp = caps[idx];
      const isLocked = locked[idx];
      const per = cp > CAP ? 26 : 41;

      const slot = document.createElement('div');
      slot.className = 'bottle-slot';
      if(idx === selected) slot.className += ' selected';
      if(isLocked) slot.className += ' locked-slot';
      let uniform = bt.length > 0 && !bt[0].k;
      for(let j=1;j<bt.length && uniform;j++) if(bt[j].c !== bt[0].c || bt[j].k) uniform = false;
      if(uniform && bt.length === cp && !isLocked) slot.className += ' solved';

      const el = document.createElement('div');
      el.className = cp > CAP ? 'bottle giant' : 'bottle';
      el.style.height = (per * cp) + 'px';

      for(let j=0;j<bt.length;j++){
        const u = bt[j];
        const seg = document.createElement('div');
        seg.className = 'segment';
        seg.style.height = (100/cp) + '%';
        if(u.k){
          seg.className += ' key-seg';
          seg.textContent = '🔑';
        } else if(u.m && !u.r){
          seg.className += ' mystery';
          seg.textContent = '?';
        } else {
          seg.style.background = PALETTE[u.c % PALETTE.length];
        }
        el.appendChild(seg);
      }

      if(isLocked){
        const lock = document.createElement('div');
        lock.className = 'lock-icon';
        lock.textContent = '🔒';
        el.appendChild(lock);
      }

      slot.appendChild(el);

      if(isLocked){
        const tag = document.createElement('div');
        tag.className = 'tag';
        if(needColor[idx] !== null){
          tag.innerHTML = 'Finish <b style="color:' + PALETTE[needColor[idx]] + '">' + NAMES[needColor[idx]] + '</b>';
        } else {
          tag.textContent = 'Needs key';
        }
        slot.appendChild(tag);
      }

      slot.addEventListener('click', function(){ tap(idx); });
      frag.appendChild(slot);
    }
    board.innerHTML = '';
    board.appendChild(frag);
    checkStuck();
  }

  function reveal(idx){
    const bt = bottles[idx];
    if(!bt.length) return false;
    const u = bt[bt.length-1];
    if(u.m && !u.r){ u.r = true; return true; }
    return false;
  }

  function revealAllTops(){
    let any = false;
    for(let i=0;i<bottles.length;i++) if(!locked[i] && reveal(i)) any = true;
    return any;
  }

  function shake(i){
    const nodes = board.children;
    if(nodes[i]){
      nodes[i].classList.add('shake');
      setTimeout(function(){ if(nodes[i]) nodes[i].classList.remove('shake'); }, 300);
    }
  }

  function tap(idx){
    if(won) return;
    const bt = bottles[idx];
    const top = bt.length ? bt[bt.length-1] : null;

    if(top && top.k){
      snapshot();
      bt.pop();
      let opened = false;
      for(let i=0;i<locked.length;i++){
        if(locked[i] && needColor[i] === null){ locked[i] = false; opened = true; }
      }
      selected = -1;
      revealAllTops();
      draw();
      save();
      toast(opened ? 'Key found — vial unlocked!' : 'Key found!');
      return;
    }

    if(locked[idx]){
      shake(idx);
      toast(needColor[idx] !== null ? 'Finish ' + NAMES[needColor[idx]] + ' to open this' : 'Find the key to open this');
      return;
    }

    if(selected === -1){
      if(!bt.length) return;
      selected = idx;
      draw();
      return;
    }

    if(selected === idx){
      selected = -1;
      draw();
      return;
    }

    const from = bottles[selected];
    const fTop = from.length ? from[from.length-1] : null;
    const dTop = bt.length ? bt[bt.length-1] : null;
    const can = fTop && !fTop.k && bt.length < caps[idx] && (!dTop || (!dTop.k && dTop.c === fTop.c));

    if(can){
      snapshot();
      bottles = pour(bottles, selected, idx, caps);
      moves++;
      movesNum.textContent = moves;
      selected = -1;
      revealAllTops();
      draw();
      save();
      if(solved(bottles, locked)){
        won = true;
        setTimeout(win, 320);
      }
    } else {
      const prev = selected;
      selected = (bt.length && !locked[idx] && !(dTop && dTop.k)) ? idx : -1;
      draw();
      shake(prev);
    }
  }

  function win(){
    document.getElementById('overlayTitle').textContent = 'Level ' + level + ' complete';
    document.getElementById('overlayText').textContent = 'Solved in ' + moves + ' move' + (moves === 1 ? '' : 's') + '.';
    overlay.classList.add('show');
  }

  let toastEl = null;
  let toastTimer = null;
  function toast(msg){
    if(!toastEl){
      toastEl = document.createElement('div');
      toastEl.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#2E2F34;color:#ECECEE;padding:10px 18px;border-radius:10px;font-family:inherit;font-size:13px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.4);opacity:0;transition:opacity .25s ease;max-width:82vw;text-align:center;pointer-events:none;';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.style.opacity = '0'; }, 2400);
  }

  exportBtn.addEventListener('click', function(){
    const data = { level, bottles, caps, locked, needColor, colors, moves, history };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'save.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast('Save file downloaded');
  });

  importBtn.addEventListener('click', function(){ importFile.click(); });

  importFile.addEventListener('change', function(e){
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = function(){
      try{
        const d = normalize(JSON.parse(r.result));
        if(!d) throw 0;
        start(d.level, d);
        toast('Save loaded — Level ' + d.level);
      }catch(err){ toast('Could not read that save file'); }
    };
    r.readAsText(f);
    importFile.value = '';
  });

  addBottleBtn.addEventListener('click', function(){
    if(won) return;
    snapshot();
    bottles.push([]);
    caps.push(CAP);
    locked.push(false);
    needColor.push(null);
    selected = -1;
    draw();
    save();
    toast('Empty vial added');
  });

  undoBtn.addEventListener('click', function(){
    if(won || !history.length) return;
    const p = history.pop();
    bottles = p.bottles;
    caps = p.caps;
    locked = p.locked;
    needColor = p.needColor;
    moves = Math.max(0, moves - 1);
    movesNum.textContent = moves;
    selected = -1;
    draw();
    save();
  });

  resetBtn.addEventListener('click', function(){ start(level); });
  nextBtn.addEventListener('click', function(){ start(level + 1); });

  const s = load();
  if(s){
    start(s.level, s);
  } else {
    let lv = 1;
    try{
      const old = JSON.parse(localStorage.getItem('ihateads_save_v1'));
      if(old && typeof old.level === 'number' && old.level > 0) lv = old.level;
    }catch(e){}
    start(lv);
  }
})();

</script>
